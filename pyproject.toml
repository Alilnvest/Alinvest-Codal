[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Alilnvest-Codal"
version = "1.7.1"
description = "Alilnvest-Codal — a resilient, typed Python client for Iranian Codal disclosures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["alilnvest", "codal", "iran", "bourse", "financial-statements", "pandas"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "requests>=2.28",
  "pandas>=2.0",
  "lxml>=5.0",
  "beautifulsoup4>=4.11",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "jdatetime>=5.0",
]

[project.optional-dependencies]
# فقط برایِ CodalHTTPClient/Codal facade و توابعِ async لازمه -- بقیه‌ی کتابخانه
# (income_statement/balance_sheet/search_letters/...) کاملاً بر پایه‌یِ requests
# کار می‌کنه و بدونِ httpx هم نصب/ایمپورت/اجرا می‌شه.
async = ["httpx>=0.27"]
quality = ["ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alilnvest_codal = ["py.typed"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The package initializer intentionally imports the legacy API before adding
# compatibility aliases at the package boundary.
"src/alilnvest_codal/__init__.py" = ["E402"]
